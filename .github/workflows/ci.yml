name: Calculator CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install Build Tools, Clang, Valgrind and Cppcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang valgrind cppcheck
    
    - name: Run Static Analysis (Cppcheck)
      run: make check
    
    - name: Run Code Style Check (Clang-Format)
      run: make format-check
    
    - name: Compile and Run Unit Tests
      run: make test
    
    - name: Check Dynamic Memory Leaks (Valgrind)
      run: make valgrind_test
    
    - name: Check Main Binary Leaks (Valgrind)
      run: |
        make calculator
        echo "2+2" | valgrind --leak-check=full --error-exitcode=1 ./calculator

  fuzzing:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y clang
    
    - name: Create Seed Corpus
      run: |
        mkdir -p fuzz/corpus
        echo "2+2" > fuzz/corpus/basic.txt
        echo "sin(0)" > fuzz/corpus/trig.txt
    
    - name: Run White Box Fuzzing (libFuzzer)
      run: make fuzz
    
    - name: Upload Fuzzing Artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzzing-artifacts
        path: |
          crash-*
          leak-*
          oom-*
          slow-unit-*
